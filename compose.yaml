name: matecitos
x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  environment: &backend-env
    DB_HOST: db
    DB_PORT: 3306
    DB_NAME: ${DB_NAME:-matecitos}
    DB_USER: ${DB_USER:-matecitos}
    DB_PASS: ${DB_PASS:?Copiá .env.example a .env y configurá DB_PASS}
    JWT_SECRET: ${JWT_SECRET:?Configurá JWT_SECRET en .env}
    PORT: 3000
    TZ: ${TZ:-America/Argentina/La_Rioja}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-matecitos}
      MYSQL_USER: ${DB_USER:-matecitos}
      MYSQL_PASSWORD: ${DB_PASS:?Configurá DB_PASS en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configurá DB_ROOT_PASSWORD en .env}
      TZ: ${TZ:-America/Argentina/La_Rioja}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [pnpm, db:migrate]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
